{% if profile is not defined %}{% set profile = p %}{% endif %}
{% if profile.rescore_status in ('pending', 'running') %}
<span id="status-{{ profile.id }}" class="status" hx-get="/rules/{{ profile.id }}/status" hx-trigger="every 3s" hx-swap="outerHTML">{{ t('rules.state.in_progress') }}</span>
{% else %}
<span id="status-{{ profile.id }}"></span>
{% endif %}
