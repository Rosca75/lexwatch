[project]
name = "lexwatch"
version = "0.1.0"
description = "Tracks Luxembourg bills filed with the Chambre des Deputes and scores them against user-defined rules."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "openpyxl>=3.1",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "azure-identity>=1.17",
]

[project.optional-dependencies]
local = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
]

[project.scripts]
lexwatch = "lexwatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/lexwatch/web/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom: `db: Session = Depends(get_db)`.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.File",
]

[tool.ruff.lint.isort]
known-first-party = ["lexwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:authlib.*"]
